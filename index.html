<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Cute Walking Cat 🐾</title>

  <!-- A-Frame & AR.js -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
    }

    /* UI Overlay */
    #ui {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10000;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
    }

    .top-card {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 10px 16px;
      border-radius: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .top-card h1 {
      margin: 0;
      font-size: 1rem;
      color: #2c3e50;
      font-weight: 700;
    }
    .top-card p {
      margin: 2px 0 0 0;
      font-size: 0.75rem;
      color: #7f8c8d;
    }

    .status-tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 12px;
      color: white;
      background: #ff5252;
      transition: background 0.3s;
    }
    .status-tag.found {
      background: #2ed573;
    }

    .bottom-panel {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 14px 16px;
      border-radius: 22px;
      box-shadow: 0 6px 25px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 440px;
      margin: 0 auto;
      width: 100%;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .row-title {
      font-size: 0.82rem;
      font-weight: 700;
      color: #2f3542;
      min-width: 70px;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      flex: 1;
      justify-content: flex-end;
    }

    .btn {
      border: none;
      outline: none;
      cursor: pointer;
      padding: 7px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      transition: transform 0.1s, background 0.2s;
    }
    .btn:active {
      transform: scale(0.92);
    }

    /* Speed Buttons */
    .btn-spd {
      background: #f1f2f6;
      color: #57606f;
    }
    .btn-spd.active {
      background: #ff4757;
      color: #fff;
    }

    /* Color Buttons */
    .btn-col.orange { background: #ffa502; color: #fff; }
    .btn-col.black  { background: #2f3542; color: #fff; }
    .btn-col.white  { background: #ffffff; color: #2f3542; border: 1.5px solid #dcdde1; }
    .btn-col.active {
      box-shadow: 0 0 0 2.5px #2ed573;
      transform: scale(1.05);
    }

    /* Marker Helper Button */
    .btn-helper {
      background: #70a1ff;
      color: #fff;
      padding: 5px 10px;
      font-size: 0.72rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      margin-right: 6px;
    }

    /* Modal */
    #marker-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 20000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
      text-align: center;
      color: white;
    }
    #marker-modal img {
      max-width: 260px;
      background: white;
      padding: 10px;
      border-radius: 10px;
      margin: 15px 0;
    }
    #marker-modal button {
      background: #ff4757;
      color: white;
      border: none;
      padding: 8px 24px;
      font-size: 0.85rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <!-- User Interface -->
  <div id="ui">
    <div class="top-card">
      <div>
        <h1>🐾 แมวน้อย AR Runner</h1>
        <p>ส่องกล้องไปที่รูปภาพ Marker</p>
      </div>
      <div style="display: flex; align-items: center;">
        <button class="btn-helper" onclick="toggleModal(true)">ดูรูป Marker</button>
        <span id="badge" class="status-tag">กำลังหา Marker...</span>
      </div>
    </div>

    <div class="bottom-panel">
      <!-- Speed Controls -->
      <div class="row">
        <span class="row-title">⚡ ความเร็ว:</span>
        <div class="btn-group">
          <button class="btn btn-spd active" onclick="setSpeed(1.0, this)">เดินชิล (1x)</button>
          <button class="btn btn-spd" onclick="setSpeed(2.2, this)">เดินเร็ว (2x)</button>
          <button class="btn btn-spd" onclick="setSpeed(4.2, this)">วิ่งสับ! (4x)</button>
        </div>
      </div>

      <!-- Color Controls -->
      <div class="row">
        <span class="row-title">🎨 สีแมว:</span>
        <div class="btn-group">
          <button class="btn btn-col orange active" onclick="setCatColor('orange', this)">ส้ม 🐱</button>
          <button class="btn btn-col black" onclick="setCatColor('black', this)">ดำ 🐈‍⬛</button>
          <button class="btn btn-col white" onclick="setCatColor('white', this)">ขาว ⚪</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Marker helper popup -->
  <div id="marker-modal">
    <h3 style="margin:0;">รูป Marker สำหรับส่อง</h3>
    <img src="marker.png" alt="Hiro Marker">
    <p style="font-size: 0.8rem; color: #dfe4ea; margin: 0 0 15px 0;">
      เปิดรูปนี้บนหน้าจอคอมฯ หรือมือถืออีกเครื่อง แล้วใช้กล้องส่อง
    </p>
    <button onclick="toggleModal(false)">ปิดหน้าต่าง</button>
  </div>

  <!-- A-Frame AR Scene -->
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best; detectionMode: mono_and_matrix;"
    renderer="colorManagement: true; precision: medium;"
    vr-mode-ui="enabled: false">

    <!-- Lights -->
    <a-entity light="type: ambient; color: #ffffff; intensity: 1.4;"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.9;" position="1 4 2"></a-entity>

    <!-- Hiro Marker -->
    <a-marker preset="hiro" id="marker">
      
      <!-- โมเดลแมวทั้งตัว (ปรับ Scale 1.2 ให้ตัวใหญ่เห็นชัดเต็มตา) -->
      <a-entity id="cat" position="0 0 0" rotation="0 90 0" scale="1.2 1.2 1.2">
        
        <!-- ลำตัวอ้วนกลม -->
        <a-sphere class="cat-skin" position="0 0.7 0" scale="0.95 0.75 0.7" color="#f39c12" roughness="0.5"></a-sphere>
        <!-- พุงขาว/สีอ่อน -->
        <a-sphere id="belly" position="0.08 0.62 0" scale="0.8 0.62 0.62" color="#fdebd0" roughness="0.6"></a-sphere>

        <!-- หัวแมวน่ารัก -->
        <a-sphere id="head" class="cat-skin" position="0.7 0.95 0" scale="0.75 0.7 0.72" color="#f39c12" roughness="0.5">
          <!-- ตาซ้าย (ตาโตดำวิ้ง) -->
          <a-sphere position="0.58 0.1 0.22" scale="0.1 0.14 0.1" color="#111111">
            <a-sphere position="0.25 0.25 0.15" radius="0.38" color="#ffffff"></a-sphere>
          </a-sphere>
          <!-- ตาขวา -->
          <a-sphere position="0.58 0.1 -0.22" scale="0.1 0.14 0.1" color="#111111">
            <a-sphere position="0.25 0.25 0.15" radius="0.38" color="#ffffff"></a-sphere>
          </a-sphere>

          <!-- จมูกชมพูจิ๋ว -->
          <a-cone position="0.7 -0.04 0" rotation="90 0 0" radius-bottom="0.06" height="0.06" color="#ff7979"></a-cone>

          <!-- แก้มชมพู -->
          <a-sphere position="0.52 -0.1 0.3" scale="0.1 0.09 0.09" color="#ff9ff3" opacity="0.8" transparent="true"></a-sphere>
          <a-sphere position="0.52 -0.1 -0.3" scale="0.1 0.09 0.09" color="#ff9ff3" opacity="0.8" transparent="true"></a-sphere>

          <!-- หูแมวซ้าย -->
          <a-cone class="cat-skin" position="0.1 0.65 0.28" rotation="0 0 -15" radius-bottom="0.22" height="0.35" color="#e67e22"></a-cone>
          <a-cone position="0.14 0.63 0.28" rotation="0 0 -15" radius-bottom="0.14" height="0.26" color="#ffb8b8"></a-cone>

          <!-- หูแมวขวา -->
          <a-cone class="cat-skin" position="0.1 0.65 -0.28" rotation="0 0 -15" radius-bottom="0.22" height="0.35" color="#e67e22"></a-cone>
          <a-cone position="0.14 0.63 -0.28" rotation="0 0 -15" radius-bottom="0.14" height="0.26" color="#ffb8b8"></a-cone>
        </a-sphere>

        <!-- ขาหน้าขวา -->
        <a-entity id="leg-fr" position="0.35 0.45 0.28">
          <a-cylinder class="cat-skin" position="0 -0.18 0" radius="0.09" height="0.36" color="#f39c12"></a-cylinder>
          <a-sphere position="0.02 -0.35 0" radius="0.1" color="#ffffff"></a-sphere>
        </a-entity>

        <!-- ขาหน้าซ้าย -->
        <a-entity id="leg-fl" position="0.35 0.45 -0.28">
          <a-cylinder class="cat-skin" position="0 -0.18 0" radius="0.09" height="0.36" color="#f39c12"></a-cylinder>
          <a-sphere position="0.02 -0.35 0" radius="0.1" color="#ffffff"></a-sphere>
        </a-entity>

        <!-- ขาหลังขวา -->
        <a-entity id="leg-br" position="-0.35 0.45 0.28">
          <a-cylinder class="cat-skin" position="0 -0.18 0" radius="0.09" height="0.36" color="#f39c12"></a-cylinder>
          <a-sphere position="0.02 -0.35 0" radius="0.1" color="#ffffff"></a-sphere>
        </a-entity>

        <!-- ขาหลังซ้าย -->
        <a-entity id="leg-bl" position="-0.35 0.45 -0.28">
          <a-cylinder class="cat-skin" position="0 -0.18 0" radius="0.09" height="0.36" color="#f39c12"></a-cylinder>
          <a-sphere position="0.02 -0.35 0" radius="0.1" color="#ffffff"></a-sphere>
        </a-entity>

        <!-- หางส่ายดุ๊กดิ๊ก -->
        <a-entity id="tail" position="-0.6 0.72 0">
          <a-cylinder class="cat-skin" position="-0.18 0.22 0" rotation="0 0 -45" radius="0.07" height="0.55" color="#e67e22"></a-cylinder>
          <a-sphere position="-0.36 0.4 0" radius="0.09" color="#ffffff"></a-sphere>
        </a-entity>

      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Palettes
    const PALETTES = {
      orange: { body: '#f39c12', belly: '#fdebd0' },
      black:  { body: '#2f3542', belly: '#57606f' },
      white:  { body: '#ffffff', belly: '#ecf0f1' }
    };

    let walkMultiplier = 1.0;
    let clock = 0;

    const legFR = document.getElementById('leg-fr');
    const legFL = document.getElementById('leg-fl');
    const legBR = document.getElementById('leg-br');
    const legBL = document.getElementById('leg-bl');
    const tail  = document.getElementById('tail');
    const catHead = document.getElementById('head');
    const marker = document.getElementById('marker');
    const badge = document.getElementById('badge');

    // Marker Events
    marker.addEventListener('markerFound', function () {
      badge.textContent = 'พบ Marker แล้ว! 🐾';
      badge.classList.add('found');
    });

    marker.addEventListener('markerLost', function () {
      badge.textContent = 'กำลังหา Marker...';
      badge.classList.remove('found');
    });

    // Walking Animation Loop
    function loop() {
      requestAnimationFrame(loop);
      clock += 0.08 * walkMultiplier;

      // Leg swing angles
      const swingR = Math.sin(clock) * 32;
      const swingL = Math.sin(clock + Math.PI) * 32;

      if (legFR) legFR.setAttribute('rotation', '0 0 ' + swingR);
      if (legFL) legFL.setAttribute('rotation', '0 0 ' + swingL);
      if (legBR) legBR.setAttribute('rotation', '0 0 ' + swingL);
      if (legBL) legBL.setAttribute('rotation', '0 0 ' + swingR);

      // Tail wagging
      if (tail) {
        const wag = Math.sin(clock * 0.9) * 25;
        tail.setAttribute('rotation', wag + ' 0 0');
      }

      // Head slight bob
      if (catHead) {
        const bob = Math.sin(clock) * 3;
        catHead.setAttribute('rotation', '0 0 ' + bob);
      }
    }
    loop();

    // Speed setter
    function setSpeed(speed, btn) {
      walkMultiplier = speed;
      document.querySelectorAll('.btn-spd').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
    }

    // Color setter
    function setCatColor(colKey, btn) {
      document.querySelectorAll('.btn-col').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');

      var pal = PALETTES[colKey];
      var skins = document.querySelectorAll('.cat-skin');
      skins.forEach(function(el) {
        el.setAttribute('color', pal.body);
      });

      var belly = document.getElementById('belly');
      if (belly) {
        belly.setAttribute('color', pal.belly);
      }
    }

    // Modal
    function toggleModal(show) {
      document.getElementById('marker-modal').style.display = show ? 'flex' : 'none';
    }
  </script>
</body>
</html>
